name: AI Code Reviewer Bot

on:
  issues:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Bot
        env:
          GEMINI_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os, requests, json

          api_key = os.getenv('GEMINI_API_KEY').strip()
          gh_token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('REPO_NAME')
          issue_num = os.getenv('ISSUE_NUMBER')
          title = os.getenv('ISSUE_TITLE')
          body = os.getenv('ISSUE_BODY')

          # URL Native API Gemini Resmi
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'

          payload = {
              'contents': [{
                  'parts': [{
                      'text': f'Bantu jawab issue ini secara singkat dan jelas dalam Bahasa Indonesia:\nJudul: {title}\nIsi: {body}'
                  }]
              }]
          }

          try:
              res = requests.post(url, json=payload, timeout=30)

              if res.status_code == 200:
                  data = res.json()
                  reply = data['candidates'][0]['content']['parts'][0]['text']
              else:
                  reply = f'⚠️ **Error dari Gemini (HTTP {res.status_code}):**\n```json\n{res.text}\n```'
          except Exception as e:
              reply = f'⚠️ **Gagal terhubung:** {str(e)}'

          # Post komentar ke GitHub Issue
          gh_url = f'https://api.github.com/repos/{repo}/issues/{issue_num}/comments'
          gh_headers = {
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github+json'
          }
          requests.post(gh_url, headers=gh_headers, json={'body': f'🤖 **AI Bot Response (Gemini):**\n\n{reply}'})
          "
