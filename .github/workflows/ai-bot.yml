name: AI Code Reviewer Bot

on:
  issues:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Bot
        env:
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os, requests, json

          api_key = os.getenv('AGENT_ROUTER_API_KEY').strip()
          gh_token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('REPO_NAME')
          issue_num = os.getenv('ISSUE_NUMBER')
          title = os.getenv('ISSUE_TITLE')
          body = os.getenv('ISSUE_BODY')

          # Panggil Endpoint Resmi AgentRouter
          try:
              ai_response = requests.post(
                  'https://co.agentrouter.org/v1/chat/completions',
                  headers={
                      'Authorization': f'Bearer {api_key}',
                      'Content-Type': 'application/json'
                  },
                  json={
                      'model': 'claude-opus-4-8',
                      'messages': [
                          {'role': 'user', 'content': f'Bantu jawab issue ini secara singkat dan jelas dalam Bahasa Indonesia:\nJudul: {title}\nIsi: {body}'}
                      ]
                  },
                  timeout=60
              )

              if ai_response.status_code == 200:
                  res_data = ai_response.json()
                  reply = res_data['choices'][0]['message']['content']
              else:
                  reply = f'⚠️ **Error dari AgentRouter (HTTP {ai_response.status_code}):**\n```json\n{ai_response.text}\n```'
          except Exception as e:
              reply = f'⚠️ **Gagal terhubung:** {str(e)}'

          # Post balasan ke GitHub Issue
          gh_url = f'https://api.github.com/repos/{repo}/issues/{issue_num}/comments'
          gh_headers = {
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github+json'
          }
          requests.post(gh_url, headers=gh_headers, json={'body': f'🤖 **AI Bot Response (Claude Opus 4.8):**\n\n{reply}'})
          "
