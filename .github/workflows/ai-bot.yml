name: AI Code Reviewer Bot

on:
  issues:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai requests

      - name: Run AI Bot
        env:
          AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c "
          import os, requests
          from openai import OpenAI

          api_key = os.getenv('AGENT_ROUTER_API_KEY')
          gh_token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('REPO_NAME')
          issue_num = os.getenv('ISSUE_NUMBER')
          title = os.getenv('ISSUE_TITLE')
          body = os.getenv('ISSUE_BODY')

          try:
              client = OpenAI(
                  api_key=api_key,
                  base_url='https://agentrouter.org/v1'
              )

              response = client.chat.completions.create(
                  model='gpt-6-astra',
                  messages=[
                      {'role': 'user', 'content': f'Bantu jawab issue ini:\nJudul: {title}\nIsi: {body}'}
                  ],
                  timeout=30.0
              )
              reply = response.choices[0].message.content
          except Exception as e:
              reply = f'Gagal memproses AI: {str(e)}'

          url = f'https://api.github.com/repos/{repo}/issues/{issue_num}/comments'
          headers = {
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github+json'
          }
          requests.post(url, headers=headers, json={'body': f'🤖 **AI Bot Response:**\n\n{reply}'})
          "
